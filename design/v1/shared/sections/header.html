<!-- Unified site-wide header — single source of truth used by ALL pages.
     Positioning via {{HEADER_MOBILE_POS}} token; nav links + CTA href via page config tokens. -->
<header>
  <div class="fixed {{HEADER_MOBILE_POS}} start-1/2 z-50 w-[90%] -translate-x-1/2 rtl:translate-x-1/2 md:bottom-auto md:top-8 md:w-auto" x-data="{ open: false }">
    <nav class="cgp-nav-island flex items-center justify-between gap-4 rounded-full px-6 py-3 md:gap-8" data-nav-island aria-label="Main navigation">
      <!-- Logo: CGP. with cyan dot + divider -->
      <a href="{{HOME_URL}}#hero" class="border-e border-cgp-border-strong pe-4 font-display text-xl font-bold tracking-tighter text-white">
        CGP<span class="text-cgp-accent">.</span>
      </a>
      <!-- Desktop links: site-wide navigation -->
      <div class="hidden gap-6 text-xs font-semibold uppercase tracking-widest text-cgp-text-secondary md:flex">
        <a href="{{HOME_URL}}#hero" class="transition-colors hover:text-cgp-accent-bright">Home</a>
        <a href="{{SHOP_URL}}" class="transition-colors hover:text-cgp-accent-bright">Shop</a>
        <a href="{{CONFIG_URL}}" class="transition-colors hover:text-cgp-accent-bright">Configurator</a>
        <a href="{{PRODUCT_URL}}" class="transition-colors hover:text-cgp-accent-bright">Product</a>
        <a href="{{CONTACT_URL}}" class="transition-colors hover:text-cgp-accent-bright">Contact</a>
      </div>
      <!-- Mobile hamburger toggle -->
      <button @click="open = !open" class="flex h-11 w-11 items-center justify-center rounded-full text-cgp-text-primary transition-colors hover:text-cgp-accent-bright md:hidden" aria-label="Toggle menu" :aria-expanded="open.toString()">
        <i class="ph ph-fill ph-list text-xl" x-cloak x-show="!open" aria-hidden="true"></i>
        <i class="ph ph-fill ph-x text-xl" x-cloak x-show="open" aria-hidden="true"></i>
      </button>
      <!-- Inquire CTA -->
      <a href="{{CTA_HREF}}" class="cgp-btn-primary cgp-magnetic ms-auto min-h-11 md:ms-0" data-magnetic>Inquire</a>
    </nav>
    <!-- Mobile dropdown -->
    <div x-cloak x-show="open" x-transition.opacity.duration.200ms @click.outside="open = false" class="cgp-nav-island mt-3 rounded-2xl p-3 md:hidden">
      <div class="flex flex-col gap-1">
        <a href="{{HOME_URL}}#hero" @click="open = false" class="rounded-lg px-4 py-3 text-xs font-semibold uppercase tracking-widest text-cgp-text-primary transition-colors hover:bg-cgp-accent/10 hover:text-cgp-accent-bright">Home</a>
        <a href="{{SHOP_URL}}" @click="open = false" class="rounded-lg px-4 py-3 text-xs font-semibold uppercase tracking-widest text-cgp-text-primary transition-colors hover:bg-cgp-accent/10 hover:text-cgp-accent-bright">Shop</a>
        <a href="{{CONFIG_URL}}" @click="open = false" class="rounded-lg px-4 py-3 text-xs font-semibold uppercase tracking-widest text-cgp-text-primary transition-colors hover:bg-cgp-accent/10 hover:text-cgp-accent-bright">Configurator</a>
        <a href="{{PRODUCT_URL}}" @click="open = false" class="rounded-lg px-4 py-3 text-xs font-semibold uppercase tracking-widest text-cgp-text-primary transition-colors hover:bg-cgp-accent/10 hover:text-cgp-accent-bright">Product</a>
        <a href="{{CONTACT_URL}}" @click="open = false" class="rounded-lg px-4 py-3 text-xs font-semibold uppercase tracking-widest text-cgp-text-primary transition-colors hover:bg-cgp-accent/10 hover:text-cgp-accent-bright">Contact</a>
      </div>
    </div>
  </div>
</header>
