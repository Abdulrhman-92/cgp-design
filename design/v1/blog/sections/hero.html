<!-- Blog hero — "Notes From The Forge" (THE ONLY h1 on the page).
     Centered layout (about-hero pattern) + CSS-only blueprint grid backdrop
     (theme utilities.css — shared with about; reduced-motion safe). -->
<section id="blog-hero" class="cgp-section relative overflow-hidden bg-cgp-bg-page" aria-labelledby="blog-hero-title">
  <!-- Ambient glow (max 2 per viewport) -->
  <div class="cgp-ambient-glow start-[-15%] top-[-30%] bg-cyan-900/20" aria-hidden="true"></div>

  <!-- Blueprint grid backdrop — shared decorative terminal grid (theme utilities.css) -->
  <div class="cgp-blueprint-grid" aria-hidden="true"></div>

  <div class="cgp-container-xl relative z-10 text-center">
    <p class="cgp-eyebrow">// SYS_BLOG</p>
    <h1 id="blog-hero-title" class="cgp-blog-hero-title mb-6">
      Notes From<br>
      <span class="cgp-glow-text bg-gradient-to-r from-cyan-400 to-blue-600 bg-clip-text text-transparent">The Forge.</span>
    </h1>
    <p class="mx-auto mb-10 max-w-xl text-sm font-light leading-relaxed text-cgp-text-secondary md:text-base">
      Build diaries, coolant chemistry, and loop architecture — written by the hands that bend the tubes. No spec-sheet fluff, only what survived the forge floor.
    </p>

    <!-- Status strip (mono, same pattern as about hero) -->
    <p class="mb-12 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 font-mono text-cgp-micro uppercase tracking-cgp-04em text-cgp-text-muted">
      <span>FIELD NOTES</span>
      <span class="text-cgp-accent" aria-hidden="true">·</span>
      <span>BUILD DIARIES</span>
      <span class="text-cgp-accent" aria-hidden="true">·</span>
      <span>0 FLUFF</span>
    </p>

    <!-- Dual CTA -->
    <div class="flex flex-col items-center justify-center gap-4 sm:flex-row">
      <a href="#blog-featured" class="cgp-btn-primary cgp-magnetic" data-magnetic>Read The Latest</a>
      <a href="{{CONFIG_URL}}" class="cgp-btn-outline cgp-magnetic" data-magnetic>Commission a Build</a>
    </div>
  </div>
</section>
