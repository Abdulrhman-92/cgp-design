<!-- About hero — "The Hands Behind The Machines" (THE ONLY h1 on the page).
     Centered layout (contact-hero pattern) + CSS-only blueprint grid backdrop
     (about.css, direction-neutral, reduced-motion safe). -->
<section id="about-hero" class="cgp-section relative overflow-hidden bg-cgp-bg-page" aria-labelledby="about-hero-title">
  <!-- Ambient glow (max 2 per viewport) -->
  <div class="cgp-ambient-glow start-[-15%] top-[-30%] bg-cyan-900/20" aria-hidden="true"></div>

  <!-- Blueprint grid backdrop — decorative terminal grid fading out from the headline -->
  <div class="cgp-blueprint-grid" aria-hidden="true"></div>

  <div class="cgp-container-xl relative z-10 text-center">
    <p class="cgp-eyebrow">// SYS_ABOUT</p>
    <h1 id="about-hero-title" class="cgp-about-hero-title mb-6">
      The Hands<br>
      <span class="cgp-glow-text bg-gradient-to-r from-cyan-400 to-blue-600 bg-clip-text text-transparent">Behind The Machines.</span>
    </h1>
    <p class="mx-auto mb-10 max-w-xl text-sm font-light leading-relaxed text-cgp-text-secondary md:text-base">
      CGP is not a PC shop — it is an atelier. Every machine that leaves our forge is bent, sealed, and stress-tested by hand in Riyadh, one commission at a time.
    </p>

    <!-- Status strip (mono, same pattern as contact hero) -->
    <p class="mb-12 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 font-mono text-cgp-micro uppercase tracking-cgp-04em text-cgp-text-muted">
      <span>RIYADH // KSA</span>
      <span class="text-cgp-accent" aria-hidden="true">·</span>
      <span>100% HAND-FORGED</span>
      <span class="text-cgp-accent" aria-hidden="true">·</span>
      <span>0 COMPROMISES</span>
    </p>

    <!-- Dual CTA -->
    <div class="flex flex-col items-center justify-center gap-4 sm:flex-row">
      <a href="#forge-story" class="cgp-btn-primary cgp-magnetic" data-magnetic>Meet The Forge</a>
      <a href="{{CONFIG_URL}}" class="cgp-btn-outline cgp-magnetic" data-magnetic>Commission a Build</a>
    </div>
  </div>
</section>
