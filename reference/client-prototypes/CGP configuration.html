<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<style>
    @keyframes breathe-glow {
        0%, 100% { opacity: 0.15; transform: scale(1) translate(0px, 0px); }
        33% { opacity: 0.3; transform: scale(1.15) translate(40px, -30px); }
        66% { opacity: 0.2; transform: scale(0.9) translate(-30px, 50px); }
    }
    .animate-breathe { animation: breathe-glow 10s ease-in-out infinite; }
    @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
    }
    .scanner-line { animation: scanline 3s linear infinite; }
    @keyframes reveal-card {
        from { opacity: 0; transform: translateY(15px) scale(0.98); filter: blur(4px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .reveal-item { animation: reveal-card 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes flow-liquid { to { stroke-dashoffset: -40; } }
    .water-flow-line { stroke-dasharray: 8, 6; animation: flow-liquid 1.2s linear infinite; }
    @keyframes gear-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin-gear { animation: gear-spin 25s linear infinite; transform-origin: center; }
    .bg-grid {
        background-size: 30px 30px;
        background-image: linear-gradient(to right, rgba(34, 211, 238, 0.02) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(34, 211, 238, 0.02) 1px, transparent 1px);
    }
    .custom-scroll::-webkit-scrollbar { width: 3px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.3); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.6); }
</style>

<div class="bg-[#020204] text-gray-300 font-sans selection:bg-cyan-500/30 overflow-hidden relative min-h-screen p-2 md:p-6 bg-grid" 
     x-data="{ 
        step: 3, 
        coolingActive: true,
        showModal: false,
        
        gpuQuery: '',

        sound: {
            ctx: null,
            init() { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } },
            playTick(freq = 150, decay = 0.06, type = 'sine') {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + decay);
                gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + decay);
                osc.start(); osc.stop(this.ctx.currentTime + decay);
            },
            playPneumatic() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let bufferSize = this.ctx.sampleRate * 0.2;
                let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
                let source = this.ctx.createBufferSource(); source.buffer = buffer;
                let filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1200;
                let gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                source.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                source.start();
            }
        },

        /* قاعدة البيانات الخاصة بك */
        database: {
            gpus: [
                /* 👇👇👇 ضع داتا الكروت الخاصة بك هنا 👇👇👇 */
                /* انسخ الداتا من ملف JSON والصقها بالكامل هنا */
                
            ]
        },

        selection: {
            gpu: null, 
        },

        get filteredGPUs() {
            if (!this.gpuQuery.trim()) return [];
            let q = this.gpuQuery.toLowerCase();
            return this.database.gpus.filter(item => 
                (item.mfgr && item.mfgr.toLowerCase().includes(q)) || 
                (item.name && item.name.toLowerCase().includes(q)) || 
                (item.cardname && item.cardname.toLowerCase().includes(q))
            );
        }
     }">

    <div class="absolute top-[-10%] left-[-10%] w-[800px] h-[800px] bg-cyan-950/10 blur-[150px] pointer-events-none rounded-full animate-breathe z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-blue-950/5 blur-[120px] pointer-events-none rounded-full animate-breathe z-0" style="animation-delay: -4s;"></div>

    <main class="max-w-[85rem] mx-auto px-4 py-6 relative z-10 flex flex-col min-h-screen justify-between">
        
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 border-b border-zinc-900 pb-6 gap-4">
            <div class="text-center sm:text-left">
                <span class="text-[8px] text-cyan-400 font-bold uppercase tracking-[0.4em] mb-1 block">CGP Custom Engine Terminal</span>
                <h1 class="text-2xl md:text-3xl font-black text-white uppercase tracking-tighter">
                    COMPATIBILITY <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">FORGE v2.0</span>
                </h1>
            </div>
            
            <button @click="coolingActive = !coolingActive; sound.playPneumatic();" 
                    class="flex items-center space-x-3 px-5 py-2 border rounded-full transition-all cursor-pointer bg-zinc-950/50 animate-pulse"
                    :class="coolingActive ? 'border-cyan-500/40 text-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.15)]' : 'border-zinc-800 text-zinc-600'">
                <span class="w-2 h-2 rounded-full" :class="coolingActive ? 'bg-cyan-400 animate-ping' : 'bg-zinc-700'"></span>
                <span class="text-[9px] font-black uppercase tracking-widest">Liquid Circulation active</span>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch mb-8">
            
            <div class="lg:col-span-7 flex flex-col gap-6">
                <div class="bg-zinc-950/40 border rounded-2xl p-6 transition-all duration-500 relative overflow-hidden border-cyan-500/70 shadow-[0_0_30px_rgba(34,211,238,0.08)] bg-zinc-900/10">
                    
                    <div class="absolute inset-0 bg-gradient-to-b from-cyan-500/0 via-cyan-500/5 to-cyan-500/0 w-full h-1/2 scanner-line pointer-events-none"></div>

                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                                <i class="ph-fill ph-cards text-amber-500 text-lg"></i>
                            </div>
                            <div>
                                <h2 class="text-white text-xs font-black uppercase tracking-wider">03. Graphics Engine</h2>
                                <p class="text-[9px] text-zinc-500 uppercase">Search active GPU JSON Database</p>
                            </div>
                        </div>
                        <span class="text-[9px] font-mono text-cyan-500/50 uppercase tracking-widest">SYS_GPU_SELECT</span>
                    </div>

                    <div class="relative z-10 mt-3">
                        <input type="text" 
                               x-model="gpuQuery" 
                               @input="sound.playTick(180, 0.05)"
                               placeholder="Type GPU model name..."
                               class="w-full bg-black border border-zinc-800 rounded-xl pl-4 pr-4 py-3.5 text-xs text-white focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition-all placeholder:text-zinc-800">
                        
                        <div x-show="!gpuQuery.trim()" class="mt-4 p-4 border border-dashed border-zinc-800 rounded-xl flex items-center justify-center space-x-3 text-zinc-600">
                            <i class="ph-bold ph-radar-beam animate-spin"></i>
                            <span class="text-[9px] font-mono uppercase tracking-widest">Awaiting GPU query input...</span>
                        </div>

                        <div x-show="gpuQuery.trim()" class="mt-3 max-h-40 overflow-y-auto custom-scroll grid grid-cols-1 gap-2 p-1">
                            <template x-for="(item, index) in filteredGPUs" :key="item.cardname + item.mfgr + index">
                                <button @click="selection.gpu = item; sound.playTick(400, 0.1);" 
                                        class="reveal-item text-left px-4 py-3 text-[10px] uppercase font-bold rounded-xl border transition-all cursor-pointer flex justify-between items-center"
                                        :style="'animation-delay: ' + (index * 40) + 'ms'"
                                        :class="selection.gpu === item ? 'border-amber-500 bg-amber-500/10 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.15)]' : 'border-zinc-900 bg-zinc-900/30 text-zinc-400 hover:border-zinc-700 hover:text-white'">
                                    
                                    <span x-text="(item.mfgr || '') + ' ' + (item.name || '') + ' ' + (item.cardname || '')"></span>
                                    <i class="ph-fill ph-circle-wavy-check text-amber-400 text-sm" x-show="selection.gpu === item"></i>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 flex flex-col">
                <div class="bg-zinc-950/80 border border-zinc-900 rounded-3xl p-6 flex-1 flex flex-col justify-between relative overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.6)]">
                    
                    <div class="flex justify-between items-center z-10">
                        <div class="flex items-center space-x-2">
                            <div class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></div>
                            <span class="text-[8px] font-mono text-amber-400 uppercase tracking-widest">LIVE TELEMETRY STREAM</span>
                        </div>
                        <span class="text-[9px] font-mono text-zinc-600">RENDER_STAGE: ACTIVE</span>
                    </div>

                    <div class="my-6 flex justify-center items-center relative h-48">
                        <div class="absolute inset-0 flex justify-center items-center opacity-[0.06] pointer-events-none">
                            <svg class="w-40 h-40 text-cyan-400 spin-gear" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="2" fill="none" />
                                <line x1="50" y1="10" x2="50" y2="90" stroke="currentColor" stroke-width="2" />
                                <line x1="10" y1="50" x2="90" y2="50" stroke="currentColor" stroke-width="2" />
                            </svg>
                        </div>

                        <svg class="w-full max-w-[280px] h-full" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="20" y="20" width="160" height="160" rx="12" stroke="#18181b" stroke-width="2" />
                            <rect x="35" y="100" width="130" height="45" rx="6" 
                                  class="transition-all duration-500"
                                  :stroke="selection.gpu ? '#f59e0b' : '#27272a'" 
                                  :stroke-width="selection.gpu ? '2.5' : '1.5'"
                                  :fill="selection.gpu ? 'rgba(245, 158, 11, 0.03)' : 'transparent'" />
                        </svg>

                        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-48 h-[3px] bg-amber-400/20 rounded-full animate-pulse"></div>
                    </div>

                    <div class="bg-black/80 border border-zinc-900 rounded-2xl p-5 space-y-3">
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="text-zinc-600 uppercase font-black">Silicon Engine</span>
                            <span class="text-amber-500 font-bold uppercase font-mono tracking-wide" 
                                  x-text="selection.gpu ? ((selection.gpu.mfgr || '') + ' ' + (selection.gpu.cardname || '')) : 'Awaiting Select...'"></span>
                        </div>
                        
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="text-zinc-600 uppercase font-black">Core Frequencies</span>
                            <span class="text-cyan-400 font-bold uppercase font-mono tracking-wide" 
                                  x-text="selection.gpu ? (selection.gpu['tablescraper-selected-row 4'] || '---') + ' MHz' : '--- / ---'"></span>
                        </div>

                        <div class="flex justify-between items-center text-[10px]">
                            <span class="text-zinc-600 uppercase font-black">Memory Architecture</span>
                            <span class="text-purple-400 font-bold uppercase font-mono tracking-wide" 
                                  x-text="selection.gpu ? (selection.gpu['tablescraper-selected-row 5'] || '---') : '---'"></span>
                        </div>

                        <div class="flex justify-between items-center text-[10px] border-t border-zinc-900 pt-3">
                            <span class="text-zinc-700 uppercase font-black">VBIOS Signature</span>
                            <span class="text-zinc-500 font-bold uppercase font-mono tracking-wide" 
                                  x-text="selection.gpu ? (selection.gpu['tablescraper-selected-row 2'] || '---') : '---'"></span>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>
</div>
